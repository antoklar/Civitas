<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Civitas</title>
  <meta name="description" content="Your Civitas dashboard — saved addresses, your representatives, and upcoming civic events." />
  <link rel="canonical" href="https://www.civitasus.com/dashboard.html" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#b5371f" />
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Civitas" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0f1923; --paper: #f4f1eb; --cream: #faf8f3;
      --accent: #b5371f; --accent-light: #f5ece9; --gold: #c9973a;
      --muted: #6e6860; --border: #ddd8ce; --card: #ffffff;
      --dem: #1a3f8f; --dem-bg: #edf2ff;
      --rep: #8f1a1a; --rep-bg: #fff0f0;
      --ind: #1a6b3a; --ind-bg: #edfff4;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .app { max-width: 900px; margin: 0 auto; padding: 0 24px 100px; }
    .app.loading-state { display: none; }

    .header { padding: 40px 0 40px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1.5px solid var(--ink); margin-bottom: 44px; gap: 24px; flex-wrap: wrap; }
    .brand-eyebrow { font-size: 0.68rem; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
    .brand-name { font-family: 'DM Serif Display', serif; font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 0.9; color: var(--ink); letter-spacing: -1.5px; }
    .brand-name em { font-style: italic; color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .nav-link { font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; color: var(--muted); text-decoration: none; }
    .nav-link:hover { color: var(--ink); }
    .logout-btn { background: none; border: 1.5px solid var(--border); color: var(--ink); padding: 9px 16px; border-radius: 3px; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .logout-btn:hover { border-color: var(--accent); color: var(--accent); }

    .welcome-block { margin-bottom: 52px; }
    .welcome-title { font-family: 'DM Serif Display', serif; font-size: 1.8rem; margin-bottom: 8px; }
    .welcome-email { font-size: 0.9rem; color: var(--muted); }

    .dash-section { margin-bottom: 48px; }
    .level-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .level-label { font-size: 0.68rem; letter-spacing: 3.5px; text-transform: uppercase; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .level-line { flex: 1; height: 1px; background: var(--border); }
    .level-count { font-size: 0.7rem; color: var(--border); font-weight: 500; }
    .level-group { margin-bottom: 32px; }
    .level-group:last-child { margin-bottom: 0; }

    .empty-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 32px 28px; position: relative; overflow: hidden; display: flex; align-items: flex-start; gap: 18px; }
    .empty-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--gold)); transform: scaleX(0); transform-origin: left; transition: transform 0.3s; }
    .empty-card:hover::after { transform: scaleX(1); }
    .empty-icon { font-size: 1.8rem; flex-shrink: 0; }
    .empty-card h3 { font-family: 'DM Serif Display', serif; font-size: 1.05rem; margin-bottom: 6px; }
    .empty-card p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; max-width: 520px; }
    .empty-card p a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .empty-card p a:hover { color: var(--ink); }

    /* Addresses */
    .add-address-btn { background: none; border: none; color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; white-space: nowrap; padding: 0; }
    .add-address-btn:hover { color: var(--ink); }
    .address-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .address-grid + .address-form { margin-top: 18px; }
    .no-address-note { font-size: 0.85rem; color: var(--muted); }
    .address-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 18px 20px; position: relative; overflow: hidden; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s; }
    .address-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--border); }
    .address-card.primary::after { background: linear-gradient(90deg, var(--accent), var(--gold)); }
    .address-card:hover { border-color: var(--accent); box-shadow: 3px 3px 0 rgba(15,25,35,0.08); transform: translate(-1px, -1px); }
    .address-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .address-card.active { border: 2px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-light); padding: 17px 19px; }
    .address-card.active:hover { transform: none; }
    .address-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .address-label { font-family: 'DM Serif Display', serif; font-size: 1rem; }
    .address-card-badges { display: flex; align-items: center; gap: 6px; }
    .primary-badge { font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; color: var(--accent); background: var(--accent-light); padding: 3px 8px; border-radius: 2px; white-space: nowrap; }
    .address-text { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
    .address-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .mini-btn { background: none; border: 1.5px solid var(--border); color: var(--ink); padding: 6px 12px; border-radius: 3px; font-family: 'DM Sans', sans-serif; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
    .mini-btn.danger:hover { border-color: var(--rep); color: var(--rep); }
    .icon-btn { background: none; border: none; padding: 4px; border-radius: 3px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: color 0.15s, background 0.15s; }
    .icon-btn:hover { color: var(--accent); background: var(--accent-light); }
    .icon-btn svg { width: 14px; height: 14px; }

    .address-form { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-top: 18px; }
    .address-form[hidden] { display: none; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .address-form .field { flex: 1; min-width: 180px; }
    .field label { font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; color: var(--muted); }
    .field input { padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; border: 2px solid var(--ink); border-radius: 3px; background: var(--cream); color: var(--ink); outline: none; transition: border-color 0.2s, box-shadow 0.2s; width: 100%; }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    .addr-input-wrapper { position: relative; }
    .address-form-actions { display: flex; gap: 10px; }
    .submit-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 3px; padding: 12px 20px; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: background 0.15s; }
    .submit-btn:hover { background: var(--accent); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cancel-btn { background: none; border: 1.5px solid var(--border); color: var(--muted); padding: 12px 18px; border-radius: 3px; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .cancel-btn:hover { border-color: var(--ink); color: var(--ink); }
    .form-msg { display: none; flex-basis: 100%; font-size: 0.82rem; line-height: 1.55; padding: 12px 14px; border-radius: 3px; border-left: 3px solid var(--accent); background: var(--accent-light); color: #6b1a0a; }
    .form-msg.visible { display: block; }

    /* Address autocomplete (mirrors homepage search) */
    .autocomplete-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--card); border: 2px solid var(--ink); border-radius: 3px; box-shadow: 4px 4px 0 rgba(15,25,35,0.15); z-index: 200; overflow: hidden; display: none; }
    .autocomplete-dropdown.visible { display: block; }
    .autocomplete-item { padding: 12px 16px; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid var(--border); transition: background 0.1s; display: flex; align-items: flex-start; gap: 10px; }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item.active { background: var(--accent-light); }
    .ac-icon { color: var(--accent); flex-shrink: 0; }
    .ac-main { font-weight: 500; color: var(--ink); }
    .ac-secondary { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .ac-loading { padding: 13px 16px; font-size: 0.8rem; color: var(--muted); font-style: italic; display: flex; align-items: center; gap: 10px; }
    .ac-spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0; }
    .spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Rep cards (mirrors homepage results styling) */
    .rep-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 22px 24px; margin-bottom: 10px; display: grid; grid-template-columns: 52px 1fr auto; gap: 18px; align-items: start; transition: box-shadow 0.18s, transform 0.15s; position: relative; overflow: hidden; cursor: pointer; }
    .rep-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border); }
    .rep-card.party-dem::before { background: var(--dem); }
    .rep-card.party-rep::before { background: var(--rep); }
    .rep-card.party-ind::before { background: var(--ind); }
    .rep-card:hover { box-shadow: 3px 3px 0 rgba(15,25,35,0.1); transform: translate(-1px, -1px); }
    .rep-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 1.1rem; flex-shrink: 0; overflow: hidden; border: 2px solid var(--border); }
    .rep-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .rep-name { font-family: 'DM Serif Display', serif; font-size: 1.05rem; line-height: 1.2; margin-bottom: 3px; }
    .rep-office { font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; }
    .rep-party-badge { display: inline-block; font-size: 0.67rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; padding: 3px 10px; border-radius: 2px; margin-bottom: 10px; }
    .party-dem .rep-party-badge { background: var(--dem-bg); color: var(--dem); }
    .party-rep .rep-party-badge { background: var(--rep-bg); color: var(--rep); }
    .party-ind .rep-party-badge { background: var(--ind-bg); color: var(--ind); }
    .party-other .rep-party-badge { background: #f5f0e8; color: var(--gold); }
    .rep-links { display: flex; flex-wrap: wrap; gap: 10px; }
    .rep-link { font-size: 0.78rem; color: var(--accent); text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .rep-link:hover { color: var(--ink); }
    .rep-side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .soon-tag { font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; color: var(--border); font-weight: 600; border: 1px solid var(--border); padding: 2px 7px; border-radius: 2px; white-space: nowrap; transition: color 0.2s, border-color 0.2s; }
    .rep-card:hover .soon-tag { color: var(--gold); border-color: var(--gold); }

    .footer { margin-top: 80px; padding-top: 24px; border-top: 1.5px solid var(--ink); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .footer-brand { font-family: 'DM Serif Display', serif; font-size: 1.1rem; }
    .footer-note { font-size: 0.75rem; color: var(--muted); }
    .footer-note a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .footer-note a:hover { color: var(--ink); }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; }
      .rep-card { grid-template-columns: 44px 1fr; }
      .rep-side { display: none; }
    }
  </style>
</head>
<body>
  <div class="app loading-state" id="app">
    <header class="header">
      <div class="brand">
        <div class="brand-eyebrow">Civic Intelligence Platform</div>
        <h1 class="brand-name">Civi<em>tas</em></h1>
      </div>
      <div class="header-actions">
        <a href="/" class="nav-link">&#8592; Back to Search</a>
        <button class="logout-btn" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <div class="welcome-block">
      <div class="welcome-title" id="welcomeTitle">Welcome back</div>
      <div class="welcome-email" id="userEmail"></div>
    </div>

    <section class="dash-section">
      <div class="level-header">
        <span class="level-label">My Addresses</span>
        <span class="level-line"></span>
        <button class="add-address-btn" id="addAddressBtn" type="button">+ Add Address</button>
      </div>
      <div class="address-grid" id="addressGrid"></div>
      <form class="address-form" id="addressForm" hidden>
        <div class="form-msg" id="addressFormMsg"></div>
        <div class="field">
          <label for="addrLabel">Label</label>
          <input type="text" id="addrLabel" required placeholder="e.g. Home, Work, Rental Property" />
        </div>
        <div class="field">
          <label for="addrValue">Address</label>
          <div class="addr-input-wrapper" id="addrFieldWrapper">
            <input type="text" id="addrValue" required placeholder="123 Main St, Springfield IL 62701" autocomplete="off" spellcheck="false" />
            <div class="autocomplete-dropdown" id="addrDropdown"></div>
          </div>
        </div>
        <div class="address-form-actions">
          <button type="submit" class="submit-btn">Save Address</button>
          <button type="button" class="cancel-btn" id="cancelAddressBtn">Cancel</button>
        </div>
      </form>
    </section>

    <section class="dash-section">
      <div class="level-header">
        <span class="level-label">Your Representatives</span>
        <span class="level-line"></span>
      </div>
      <div class="empty-card" id="repsStatus" style="display:none;"></div>
      <div id="repsContainer"></div>
    </section>

    <section class="dash-section">
      <div class="level-header">
        <span class="level-label">Upcoming Civic Events</span>
        <span class="level-line"></span>
      </div>
      <div class="empty-card">
        <div class="empty-icon">🗓️</div>
        <div>
          <h3>Coming soon</h3>
          <p>Town halls, local elections, and community meetings near you will show up here.</p>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span class="footer-brand">Civitas</span>
      <span class="footer-note">Information is power. So is knowing who to call. · <a href="/about.html">About Civitas</a></span>
    </footer>
  </div>

  <script>
    const SUPABASE_URL = 'https://mhcupdxtgvhmxnddshhd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_z2i0uc0CrH47APPNlyH_6g_8Kjb37vA';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const appEl = document.getElementById('app');

    const LEVEL_MAP = { country:'National', administrativeArea1:'State', administrativeArea2:'Local', locality:'Local', subLocality1:'Local', subLocality2:'Local', special:'Local' };
    const LEVEL_ORDER = ['National','State','Local'];

    let currentUser = null;
    let addresses = [];
    let allRepsData = [];

    function getPartyClass(party='') {
      if (/democrat/i.test(party)) return 'party-dem';
      if (/republican/i.test(party)) return 'party-rep';
      if (/independent|nonpartisan/i.test(party)) return 'party-ind';
      return 'party-other';
    }

    function getInitials(name='') {
      return name.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    }

    function renderUser(user) {
      const firstName = user.user_metadata?.first_name;
      const displayName = firstName || (user.email ? user.email.split('@')[0] : 'there');
      document.getElementById('welcomeTitle').textContent = `Welcome back, ${displayName}`;
      document.getElementById('userEmail').textContent = user.email || '';
      appEl.classList.remove('loading-state');
      appEl.style.display = 'block';
    }

    // ── Addresses ──────────────────────────────────────────────────────────
    const addressGrid = document.getElementById('addressGrid');
    const addressForm = document.getElementById('addressForm');
    const addressFormMsg = document.getElementById('addressFormMsg');
    const addrLabelInput = document.getElementById('addrLabel');
    const addrValueInput = document.getElementById('addrValue');
    const addAddressBtn = document.getElementById('addAddressBtn');
    const cancelAddressBtn = document.getElementById('cancelAddressBtn');
    const EDIT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

    let editingId = null;
    let viewingId = null;

    function showFormMsg(text) {
      addressFormMsg.textContent = text;
      addressFormMsg.classList.add('visible');
    }
    function clearFormMsg() {
      addressFormMsg.textContent = '';
      addressFormMsg.classList.remove('visible');
    }

    function openAddForm() {
      editingId = null;
      addressForm.reset();
      clearFormMsg();
      addressForm.querySelector('.submit-btn').textContent = 'Save Address';
      addressForm.hidden = false;
      addrLabelInput.focus();
    }

    function openEditForm(id) {
      const addr = addresses.find(a => a.id === id);
      if (!addr) return;
      editingId = id;
      clearFormMsg();
      addrLabelInput.value = addr.label;
      addrValueInput.value = addr.address;
      addressForm.querySelector('.submit-btn').textContent = 'Update Address';
      addressForm.hidden = false;
      addrLabelInput.focus();
    }

    function closeAddressForm() {
      editingId = null;
      addressForm.reset();
      clearFormMsg();
      addressForm.hidden = true;
    }

    function renderAddresses() {
      if (!addresses.length) {
        addressGrid.innerHTML = '<p class="no-address-note">No saved addresses yet — add one to see your representatives.</p>';
        return;
      }
      addressGrid.innerHTML = addresses.map(a => `
        <div class="address-card${a.is_primary ? ' primary' : ''}${a.id === viewingId ? ' active' : ''}" data-id="${a.id}" role="button" tabindex="0" aria-pressed="${a.id === viewingId}">
          <div class="address-card-top">
            <span class="address-label">${a.label}</span>
            <div class="address-card-badges">
              ${a.is_primary ? '<span class="primary-badge">Primary</span>' : ''}
              <button class="icon-btn" type="button" data-action="edit" data-id="${a.id}" title="Edit address" aria-label="Edit address">${EDIT_ICON}</button>
            </div>
          </div>
          <div class="address-text">${a.address}</div>
          <div class="address-actions">
            ${!a.is_primary ? `<button class="mini-btn" data-action="primary" data-id="${a.id}">Set as Primary</button>` : ''}
            <button class="mini-btn danger" data-action="remove" data-id="${a.id}">Remove</button>
          </div>
        </div>
      `).join('');
    }

    async function loadAddresses() {
      const { data, error } = await sb.from('profiles').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: true });
      if (error) {
        console.error(error);
        addressGrid.innerHTML = `<p class="no-address-note">Couldn't load your saved addresses (${error.message}). Try refreshing the page.</p>`;
        return;
      }
      let list = data || [];

      const homeAddress = currentUser.user_metadata?.home_address;
      if (list.length === 0 && homeAddress) {
        const { data: seeded, error: seedError } = await sb.from('profiles').insert({
          user_id: currentUser.id, label: 'Home', address: homeAddress, is_primary: true
        }).select();
        if (seedError) console.error(seedError);
        if (seeded) list = seeded;
      }

      if (list.length > 0 && !list.some(a => a.is_primary)) {
        await sb.from('profiles').update({ is_primary: true }).eq('id', list[0].id);
        list[0].is_primary = true;
      }

      addresses = list;
      const primary = addresses.find(a => a.is_primary) || addresses[0];
      viewingId = primary ? primary.id : null;
      renderAddresses();

      if (primary) {
        loadRepsForAddress(primary.address);
      } else {
        document.getElementById('repsContainer').innerHTML = '';
        showRepsStatus('🏛️', 'No address on file', 'Add an address above to automatically see your representatives.');
      }
    }

    function selectAddressCard(id) {
      if (id === viewingId) return;
      const addr = addresses.find(a => a.id === id);
      if (!addr) return;
      viewingId = id;
      renderAddresses();
      loadRepsForAddress(addr.address);
    }

    addAddressBtn.addEventListener('click', () => {
      if (!addressForm.hidden && editingId === null) closeAddressForm();
      else openAddForm();
    });
    cancelAddressBtn.addEventListener('click', () => { closeAddressForm(); });

    addressForm.addEventListener('submit', async e => {
      e.preventDefault();
      clearFormMsg();
      const label = addrLabelInput.value.trim();
      const address = addrValueInput.value.trim();
      if (!label || !address) return;

      const duplicate = addresses.find(a => a.label.trim().toLowerCase() === label.toLowerCase() && a.id !== editingId);
      if (duplicate) {
        showFormMsg(`You already have an address labeled ${duplicate.label}. Choose a different label or edit the existing one.`);
        return;
      }

      const btn = addressForm.querySelector('.submit-btn');
      btn.disabled = true; btn.textContent = editingId ? 'Updating...' : 'Saving...';

      const { error } = editingId
        ? await sb.from('profiles').update({ label, address }).eq('id', editingId)
        : await sb.from('profiles').insert({ user_id: currentUser.id, label, address, is_primary: addresses.length === 0 });

      btn.disabled = false; btn.textContent = editingId ? 'Update Address' : 'Save Address';
      if (error) { showFormMsg(error.message); return; }
      closeAddressForm();
      await loadAddresses();
    });

    addressGrid.addEventListener('click', async e => {
      const btn = e.target.closest('[data-action]');
      if (btn) {
        const id = btn.dataset.id;
        if (btn.dataset.action === 'edit') { openEditForm(id); return; }
        btn.disabled = true;
        if (btn.dataset.action === 'primary') {
          await sb.from('profiles').update({ is_primary: false }).eq('user_id', currentUser.id);
          await sb.from('profiles').update({ is_primary: true }).eq('id', id);
        } else if (btn.dataset.action === 'remove') {
          if (editingId === id) closeAddressForm();
          await sb.from('profiles').delete().eq('id', id);
        }
        await loadAddresses();
        return;
      }

      const card = e.target.closest('.address-card[data-id]');
      if (card) selectAddressCard(card.dataset.id);
    });

    addressGrid.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (e.target.closest('[data-action]')) return;
      const card = e.target.closest('.address-card[data-id]');
      if (!card) return;
      e.preventDefault();
      selectAddressCard(card.dataset.id);
    });

    // ── Address autocomplete (mirrors homepage search) ──────────────────────
    const addrFieldWrapper = document.getElementById('addrFieldWrapper');
    const addrDropdown = document.getElementById('addrDropdown');
    let addrSuggestions = [];
    let addrActiveIdx = -1;
    let addrDebounceTimer = null;

    function renderAddrDropdown() {
      if (addrSuggestions.length === 0) { addrDropdown.classList.remove('visible'); return; }
      addrDropdown.innerHTML = addrSuggestions.map((s, i) => `
        <div class="autocomplete-item${i === addrActiveIdx ? ' active' : ''}" data-idx="${i}">
          <span class="ac-icon">📍</span>
          <div>
            <div class="ac-main">${s.main}</div>
            ${s.secondary ? `<div class="ac-secondary">${s.secondary}</div>` : ''}
          </div>
        </div>
      `).join('');
      addrDropdown.classList.add('visible');
      addrDropdown.querySelectorAll('.autocomplete-item').forEach(item => {
        item.addEventListener('mousedown', e => {
          e.preventDefault();
          selectAddrSuggestion(addrSuggestions[parseInt(item.dataset.idx)]);
        });
      });
    }

    function selectAddrSuggestion(s) {
      addrValueInput.value = s.full || `${s.main}, ${s.secondary}`;
      addrSuggestions = [];
      addrDropdown.classList.remove('visible');
    }

    async function fetchAddrSuggestions(val) {
      if (val.trim().length < 4) { addrSuggestions = []; renderAddrDropdown(); return; }
      addrDropdown.innerHTML = '<div class="ac-loading"><div class="ac-spinner"></div>Finding addresses...</div>';
      addrDropdown.classList.add('visible');
      try {
        const res = await fetch(`/api/autocomplete?input=${encodeURIComponent(val)}`);
        const data = await res.json();
        addrSuggestions = data.suggestions || [];
        addrActiveIdx = -1;
        renderAddrDropdown();
      } catch { addrSuggestions = []; addrDropdown.classList.remove('visible'); }
    }

    addrValueInput.addEventListener('input', e => {
      clearTimeout(addrDebounceTimer);
      addrDebounceTimer = setTimeout(() => fetchAddrSuggestions(e.target.value), 300);
    });

    addrValueInput.addEventListener('keydown', e => {
      if (addrSuggestions.length === 0) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); addrActiveIdx = Math.min(addrActiveIdx + 1, addrSuggestions.length - 1); renderAddrDropdown(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); addrActiveIdx = Math.max(addrActiveIdx - 1, -1); renderAddrDropdown(); }
      else if (e.key === 'Enter' && addrActiveIdx >= 0) { e.preventDefault(); selectAddrSuggestion(addrSuggestions[addrActiveIdx]); }
      else if (e.key === 'Escape') { addrSuggestions = []; addrDropdown.classList.remove('visible'); }
    });

    document.addEventListener('click', e => {
      if (!addrFieldWrapper.contains(e.target)) {
        addrDropdown.classList.remove('visible');
      }
    });

    // ── Representatives ───────────────────────────────────────────────────
    const repsContainer = document.getElementById('repsContainer');
    const repsStatus = document.getElementById('repsStatus');

    function showRepsStatus(icon, title, text) {
      repsStatus.style.display = 'flex';
      repsStatus.innerHTML = `<div class="empty-icon">${icon}</div><div><h3>${title}</h3><p>${text}</p></div>`;
    }
    function showRepsLoading(text) {
      repsStatus.style.display = 'flex';
      repsStatus.innerHTML = `<div class="spinner"></div><div><h3>Looking up your representatives</h3><p>${text}</p></div>`;
    }
    function hideRepsStatus() {
      repsStatus.style.display = 'none';
    }

    function renderRepsData(data) {
      const grouped = {};
      (data.offices || []).forEach(office => {
        const level = LEVEL_MAP[office.levels?.[0]] || 'Local';
        if (!grouped[level]) grouped[level] = [];
        (office.officialIndices || []).forEach(idx => {
          const official = data.officials?.[idx];
          if (official) grouped[level].push({ official, office: { name: office.name } });
        });
      });

      if (Object.keys(grouped).length === 0) {
        repsContainer.innerHTML = '';
        showRepsStatus('🏛️', 'No representatives found', 'We couldn\'t find representatives for that address. Double-check it under My Addresses.');
        return;
      }

      hideRepsStatus();
      allRepsData = [];
      repsContainer.innerHTML = LEVEL_ORDER.map(level => {
        const officials = grouped[level];
        if (!officials?.length) return '';
        return `
          <div class="level-group">
            <div class="level-header">
              <span class="level-label">${level}</span>
              <span class="level-line"></span>
              <span class="level-count">${officials.length} rep${officials.length !== 1 ? 's' : ''}</span>
            </div>
            ${officials.map(({ official, office }) => {
              const repIdx = allRepsData.length;
              allRepsData.push({ official, office });
              const partyClass = getPartyClass(official.party);
              const phone = official.phones?.[0] || '';
              const url = official.urls?.[0] || '';
              return `
                <div class="rep-card ${partyClass}" data-rep-idx="${repIdx}">
                  <div class="rep-avatar">
                    ${official.photoUrl
                      ? `<img src="${official.photoUrl}" alt="${official.name}" onerror="this.style.display='none'">`
                      : getInitials(official.name)}
                  </div>
                  <div>
                    <div class="rep-name">${official.name}</div>
                    <div class="rep-office">${office.name}</div>
                    <span class="rep-party-badge">${official.party || 'Unknown Party'}</span>
                    <div class="rep-links">
                      ${phone ? `<a href="tel:${phone}" class="rep-link">📞 ${phone}</a>` : ''}
                      ${url ? `<a href="${url}" target="_blank" rel="noopener noreferrer" class="rep-link">🔗 Official Site</a>` : ''}
                    </div>
                  </div>
                  <div class="rep-side">
                    <span class="soon-tag">View Profile</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('');
    }

    async function fetchRepsOnce(address) {
      const res = await fetch(`/api/representatives?address=${encodeURIComponent(address)}`);
      let data = null;
      try { data = await res.json(); } catch { /* non-JSON error body */ }
      return { res, data };
    }

    // The Census geocoder that /api/representatives relies on is known to be
    // transiently flaky (occasional 502s). Retry once, directly, before
    // surfacing an error to the user.
    async function fetchRepsWithFallback(address) {
      let { res, data } = await fetchRepsOnce(address);
      const isCensusHiccup = res.status === 502 || res.status === 504 || (!res.ok && /census/i.test(data?.error || ''));
      if (isCensusHiccup) {
        ({ res, data } = await fetchRepsOnce(address));
      }
      if (!res.ok || data?.error) {
        throw new Error(data?.error || `Lookup failed (${res.status})`);
      }
      return data;
    }

    async function loadRepsForAddress(address) {
      repsContainer.innerHTML = '';
      showRepsLoading(`Pulling from public government records for ${address}.`);
      try {
        const data = await fetchRepsWithFallback(address);
        renderRepsData(data);
      } catch (err) {
        showRepsStatus('⚠️', 'Couldn\'t look up representatives', err.message || 'Please check this address under My Addresses and try again.');
      }
    }

    repsContainer.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      const card = e.target.closest('.rep-card[data-rep-idx]');
      if (!card) return;
      const repData = allRepsData[parseInt(card.dataset.repIdx)];
      if (repData) {
        sessionStorage.setItem('civitas_selected_official', JSON.stringify(repData));
        const bioguideId = repData.official?.bioguideId;
        window.location.href = bioguideId
          ? `/representative.html?bioguide=${encodeURIComponent(bioguideId)}`
          : '/representative.html';
      }
    });

    // ── Init ──────────────────────────────────────────────────────────────
    (async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = '/auth.html'; return; }
      currentUser = session.user;
      renderUser(currentUser);
      try {
        await loadAddresses();
      } catch (err) {
        console.error(err);
        showRepsStatus('⚠️', 'Couldn\'t look up representatives', 'Something went wrong loading your dashboard data. Try refreshing the page.');
      }
    })();

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT' || !session) window.location.href = '/auth.html';
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = '/auth.html';
    });
  </script>
</body>
</html>
